name = "barnes-hauling"
main = ".open-next/worker.js"
compatibility_date = "2026-08-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "barnes-hauling"

[observability]
enabled = true

[build]
command = "npm run cf:build"
